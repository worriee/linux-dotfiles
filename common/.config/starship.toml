"$schema" = 'https://starship.rs/config-schema.json'

format = """
$status\
[](bold fg:#a3aed2)\
[ julry](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:zone_blue)\
$git_branch\
$git_status\
[](fg:zone_blue bg:zone_blue)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:zone_blue bg:time_blue)\
$time\
[](fg:time_blue)\
\n$character"""

palette = "theme"

[palettes.theme]
curve_ok = "#769ff0"
curve_err = "#e3242b"
zone_blue = "#5671A8"
time_blue = "#42547B"

[character]
success_symbol = "[╰─❯](bold fg:curve_ok)"
error_symbol = "[╰─❯](bold fg:curve_err)"

[status]
format = "[$symbol]($style)"
disabled = false
success_symbol = "╭─"
symbol = "╭─"
not_executable_symbol = "╭─"
not_found_symbol = "╭─"
sigint_symbol = "╭─"
signal_symbol = "╭─"
success_style = "bold fg:curve_ok"
failure_style = "bold fg:curve_err"

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol $branch ](fg:#e3e5e5 bg:zone_blue)]($style)'

[git_status]
style = "bg:zone_blue"
format = '[[($all_status$ahead_behind )](fg:#e3e5e5 bg:zone_blue)]($style)'

[nodejs]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol ($version) ](fg:#e3e5e5 bg:zone_blue)]($style)'

[bun]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol ($version) ](fg:#e3e5e5 bg:zone_blue)]($style)'

[rust]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol ($version) ](fg:#e3e5e5 bg:zone_blue)]($style)'

[golang]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol ($version) ](fg:#e3e5e5 bg:zone_blue)]($style)'

[php]
symbol = ""
style = "bg:zone_blue"
format = '[[ $symbol ($version) ](fg:#e3e5e5 bg:zone_blue)]($style)'

[time]
disabled = false
time_format = "%I:%M" # Hour:Minute Format
style = "bg:time_blue"
format = '[[ $time ](fg:#a0a9cb bg:time_blue)]($style)'
